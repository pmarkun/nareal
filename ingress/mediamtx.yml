logLevel: warn
rtmp: yes
rtmpAddress: :1935
rtsp: no
hls: no
webrtc: no
srt: no
api: no
metrics: no
pprof: no
# Secrets override these fail-closed hashes through indexed environment variables.
authInternalUsers:
  - user: publisher
    pass: sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ips: []
    permissions:
      - action: publish
        path: live
  - user: reader
    pass: sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ips: []
    permissions:
      - action: read
        path: live
paths:
  live:
    source: publisher
    overridePublisher: false
